
services:
  registry:
    image: registry:3.0.0@sha256:6c5666b861f3505b116bb9aa9b25175e71210414bd010d92035ff64018f9457e
    restart: unless-stopped
    ports:
      - "127.0.0.1:5000:5000"
    volumes:
      - ./local/registry/data:/var/lib/registry

  gitlab:
    image: gitlab/gitlab-ce:18.4.2-ce.0
    hostname: localhost
    restart: unless-stopped
    shm_size: "256m"
    env_file:
      # Created locally by scripts/initialize-gitlab.sh; never commit this file.
      - ./local/gitlab-root-password.env
    environment:
      GITLAB_OMNIBUS_CONFIG: |
        # Keep these values synchronized with the host port mappings below.
        external_url 'http://localhost:8929'
        gitlab_rails['gitlab_shell_ssh_port'] = 2222
        # This setting is used only when GitLab creates its first database.
        gitlab_rails['initial_root_password'] = ENV['GITLAB_ROOT_PASSWORD']
    ports:
      - "8929:8929"   # Matches external_url: http://localhost:8929
      - "2222:22"     # Git-over-SSH endpoint: ssh://git@localhost:2222/<group>/<project>.git
    volumes:
      - ./local/gitlab/config:/etc/gitlab
      - ./local/gitlab/logs:/var/log/gitlab
      - ./local/gitlab/data:/var/opt/gitlab

  runner:
    build:
      context: ./images/runner-image
    image: otus-gitlab-runner:local
    restart: unless-stopped
    privileged: true # Required only for the Docker daemon inside this trusted local lab.
    depends_on:
      - gitlab
      - registry
    extra_hosts:
      # The Runner itself reaches its local proxy at 127.0.0.1.
      # Docker jobs use the host-gateway mapping supplied by config.toml.
      - "gitlab.local:127.0.0.1"
      # The nested Docker daemon reaches the outer Compose Registry via socat.
      - "registry.localhost:127.0.0.1"
    volumes:
      - ./local/runner/config:/etc/gitlab-runner
      - ./local/runner/docker:/var/lib/docker
    ports:
      # Forward workloads published by the Runner's internal Docker daemon.
      - "127.0.0.1:8083:8083"
      - "127.0.0.1:8084:8084"
