.deploy_environment:
  image:
    name: alpine/k8s:1.31.5
  # The pinned image contains kubectl and sed. Bash is installed for the
  # readable deploy script; this trusted local job has no host runtime socket.
  rules:
    - if: !reference [.rules, trigger-full-pipeline-sources]
  before_script:
    - apk add --no-cache bash git
  script:
    - git clone "${SHARED_CI_SERVER_URL%%://*}://gitlab-ci-token:${CI_JOB_TOKEN}@${SHARED_CI_SERVER_URL#*://}/${CI_PROJECT_NAMESPACE}/ci.git" shared-ci
    - ./shared-ci/stages/scripts/deploy-environment.sh "$ENVIRONMENT_NAME" "$ENVIRONMENT_PORT" "$APP_IMAGE_REF"

deploy_stage:
  extends: .deploy_environment
  stage: deploy_nonprod
  variables:
    ENVIRONMENT_NAME: stage
    ENVIRONMENT_PORT: $STAGE_NODE_PORT
  needs:
    - job: version_and_realease
      artifacts: true
  environment:
    name: stage
    url: http://localhost:8083

deploy_prod:
  extends: .deploy_environment
  stage: deploy_prod
  variables:
    ENVIRONMENT_NAME: prod
    ENVIRONMENT_PORT: $PROD_NODE_PORT
  when: manual
  allow_failure: false
  needs:
    - job: version_and_realease
      artifacts: true
    - job: deploy_stage
      artifacts: false
  environment:
    name: prod
    url: http://localhost:8084
