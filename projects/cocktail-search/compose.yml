services:
  postgres:
    image: postgres:17.11-alpine3.24
    environment:
      POSTGRES_DB: ${DB_NAME:-cocktail_catalog}
      POSTGRES_USER: ${DB_USER:-cocktail}
      # Local-learning default only. Never reuse it outside this machine.
      POSTGRES_PASSWORD: ${DB_PASSWORD:-cocktail-local-only}
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
#    volumes:
#      - ./local/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 12
