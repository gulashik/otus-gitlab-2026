# Pipeline map:
# - feature branch push: build_check
# - MR pipeline: test + validate_branch_name -> build_check
# - main push or run pipeline for main: test -> build_check -> version -> stage -> manual prod
# - run pipeline for a non-default branch: build_check

default:
  tags:
    - docker

workflow:
  rules:
    # After an MR is opened, use its MR pipeline instead of a duplicate push pipeline.
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS && $CI_PIPELINE_SOURCE == "push"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "push"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - when: never

stages:
  - test
  - build
  - version
  - deploy_nonprod
  - deploy_prod

#====== TEST ======
validate_branch_name:
  stage: test
  image: alpine:3.21
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  script:
    - |
      case "$CI_MERGE_REQUEST_SOURCE_BRANCH_NAME" in
        feature/*|bugfix/*|hotfix/*)
          echo "Accepted merge-request source branch: $CI_MERGE_REQUEST_SOURCE_BRANCH_NAME"
          ;;
        *)
          echo "Invalid merge-request source branch: $CI_MERGE_REQUEST_SOURCE_BRANCH_NAME"
          echo "Use a branch beginning with feature/, bugfix/, or hotfix/."
          exit 1
          ;;
      esac

test:
  stage: test
  image: eclipse-temurin:21-jdk
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '($CI_PIPELINE_SOURCE == "push" || $CI_PIPELINE_SOURCE == "web") && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  script:
    - ./gradlew test --no-daemon


#====== BUILD ======
build_check:
  stage: build
  image: docker:29-cli
  variables:
    DOCKER_HOST: unix:///var/run/docker.sock
    DOCKER_BUILDKIT: "0"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" || $CI_PIPELINE_SOURCE == "web"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  script:
    - docker build --pull --file Containerfile --tag "cocktail-search-build-check:${CI_COMMIT_SHA}" .

#====== VERSION AND RELEASE ======
version:
  stage: version
  image: docker:29-cli
  resource_group: versioning # serialize job concurrency exclude racing
  variables:
    DOCKER_HOST: unix:///var/run/docker.sock
    DOCKER_BUILDKIT: "0"
    GIT_DEPTH: "0"
    REGISTRY_IMAGE: registry.localhost:5000/gulash-prj/cocktail-search
  rules:
    - if: '($CI_PIPELINE_SOURCE == "push" || $CI_PIPELINE_SOURCE == "web") && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  before_script:
    - apk add --no-cache bash git
    - git fetch --tags origin
  script:
    - |
      bash -euo pipefail <<'BASH'
      valid_tag_pattern='^v([0-9]+)\.([0-9]+)\.([0-9]+)$'
      head_tag="$(git tag --points-at HEAD --list 'v*' \
        | grep -E "$valid_tag_pattern" \
        | sort -V \
        | tail -n 1 || true)"

      if [[ -n "$head_tag" ]]; then
        APP_VERSION="${head_tag#v}"
      else
        base_tag="$(git tag --merged HEAD --list 'v*' \
          | grep -E "$valid_tag_pattern" \
          | sort -V \
          | tail -n 1 || true)"
        base_version="${base_tag#v}"
        [[ -n "$base_tag" ]] || base_version='0.0.0'
        IFS='.' read -r major minor patch <<<"$base_version"
        commit_range="${base_tag:+${base_tag}..HEAD}"
        commit_range="${commit_range:-HEAD}"

        # vMAJOR.MINOR.PATCH - assemble a version
        if git log --format='%B' "$commit_range" | grep -qE 'BREAKING CHANGE|\[major\]'; then
          APP_VERSION="$((major + 1)).0.0"
        elif git log --merges --format='%s' "$commit_range" \
          | grep -qE "^Merge branch 'feature/[^']+' into '"; then
          APP_VERSION="${major}.$((minor + 1)).0"
        else
          APP_VERSION="${major}.${minor}.$((patch + 1))"
        fi
      fi

      APP_IMAGE_REF="${REGISTRY_IMAGE}:${CI_COMMIT_SHA}"
      RELEASE_IMAGE_REF="${REGISTRY_IMAGE}:v${APP_VERSION}"
      docker build --pull --file Containerfile --tag "$APP_IMAGE_REF" .
      docker push "$APP_IMAGE_REF"
      release_tag="v${APP_VERSION}"
      if ! git tag --points-at HEAD --list "$release_tag" | grep -qx "$release_tag"; then
        git config user.name 'GitLab CI release job'
        git config user.email 'gitlab-ci@localhost'
        git tag -a "$release_tag" -m "Release ${release_tag}"
        git push origin "$release_tag"
      fi
      docker tag "$APP_IMAGE_REF" "$RELEASE_IMAGE_REF"
      docker push "$RELEASE_IMAGE_REF"
      printf 'APP_VERSION=%s\nAPP_IMAGE_REF=%s\n' "$APP_VERSION" "$APP_IMAGE_REF" > version.env
      BASH
  artifacts:
    reports:
      dotenv: version.env

#====== DEPLOY ======
deploy_stage:
  stage: deploy_nonprod
  image: alpine:3.21
  rules:
    - if: '($CI_PIPELINE_SOURCE == "push" || $CI_PIPELINE_SOURCE == "web") && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  needs:
    - job: version
      artifacts: true
  environment:
    name: stage
  script:
    - echo "Stage environment recorded for ${APP_IMAGE_REF} (version ${APP_VERSION}). Real Podman deployment is deferred."

deploy_prod:
  stage: deploy_prod
  image: alpine:3.21
  rules:
    - if: '($CI_PIPELINE_SOURCE == "push" || $CI_PIPELINE_SOURCE == "web") && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  when: manual
  allow_failure: false
  needs:
    - job: deploy_stage
      artifacts: false
  environment:
    name: prod
  script:
    - echo 'Production environment recorded. Real Podman deployment is deferred.'
