workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push"'
    - when: never

stages:
  - test
  - build
  - deploy

test:
  stage: test
  image: eclipse-temurin:21-jdk
  tags:
    - docker
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  script:
    - ./gradlew test --no-daemon

build_check:
  stage: build
  image: docker:29-cli
  tags:
    - docker
  variables:
    DOCKER_HOST: unix:///var/run/docker.sock
    DOCKER_BUILDKIT: "0"
  rules:
    - if: '$CI_COMMIT_BRANCH'
  script:
    - docker build --pull --file Containerfile --tag "cocktail-search-build-check:${CI_COMMIT_SHA}" .

deploy_stage:
  stage: deploy
  image: alpine:3.21
  tags:
    - docker
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  environment:
    name: stage
  script:
    - echo 'Stage environment recorded. Real Podman deployment is deferred.'

deploy_prod:
  stage: deploy
  image: alpine:3.21
  tags:
    - docker
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  when: manual
  allow_failure: false
  environment:
    name: prod
  script:
    - echo 'Production environment recorded. Real Podman deployment is deferred.'
