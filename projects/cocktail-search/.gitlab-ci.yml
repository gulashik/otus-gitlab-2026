# Pipeline map:
# - feature branch push: build_check
# - MR pipeline: test + validate_branch_name -> build_check
# - main push or run pipeline for main: test -> build_check -> stage -> manual prod
# - run pipeline for a non-default branch: build_check

default:
  tags:
    - docker

workflow:
  rules:
    # After an MR is opened, use its MR pipeline instead of a duplicate push pipeline.
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS && $CI_PIPELINE_SOURCE == "push"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "push"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - when: never

stages:
  - test
  - build
  - deploy_nonprod
  - deploy_prod

#====== TEST ======
validate_branch_name:
  stage: test
  image: alpine:3.21
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  script:
    - |
      case "$CI_MERGE_REQUEST_SOURCE_BRANCH_NAME" in
        feature/*|bugfix/*|hotfix/*)
          echo "Accepted merge-request source branch: $CI_MERGE_REQUEST_SOURCE_BRANCH_NAME"
          ;;
        *)
          echo "Invalid merge-request source branch: $CI_MERGE_REQUEST_SOURCE_BRANCH_NAME"
          echo "Use a branch beginning with feature/, bugfix/, or hotfix/."
          exit 1
          ;;
      esac

test:
  stage: test
  image: eclipse-temurin:21-jdk
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '($CI_PIPELINE_SOURCE == "push" || $CI_PIPELINE_SOURCE == "web") && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  script:
    - ./gradlew test --no-daemon


#====== BUILD ======
build_check:
  stage: build
  image: docker:29-cli
  variables:
    DOCKER_HOST: unix:///var/run/docker.sock
    DOCKER_BUILDKIT: "0"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" || $CI_PIPELINE_SOURCE == "web"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  script:
    - docker build --pull --file Containerfile --tag "cocktail-search-build-check:${CI_COMMIT_SHA}" .

#====== DEPLOY ======
deploy_stage:
  stage: deploy_nonprod
  image: alpine:3.21
  rules:
    - if: '($CI_PIPELINE_SOURCE == "push" || $CI_PIPELINE_SOURCE == "web") && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  environment:
    name: stage
  script:
    - echo 'Stage environment recorded. Real Podman deployment is deferred.'

deploy_prod:
  stage: deploy_prod
  image: alpine:3.21
  rules:
    - if: '($CI_PIPELINE_SOURCE == "push" || $CI_PIPELINE_SOURCE == "web") && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  when: manual
  allow_failure: false
  needs:
    - job: deploy_stage
      artifacts: false
  environment:
    name: prod
  script:
    - echo 'Production environment recorded. Real Podman deployment is deferred.'
